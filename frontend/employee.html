<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Associate Lead Portal | Munendra Naick</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <!-- TOP APP BAR MATCHING ADMIN PANEL -->
  <header class="admin-topbar">
    <div class="topbar-left">
      <div class="brand-cluster">
        <h1 class="portal-heading">
          <span class="portal-brand-text">Talent Forge</span> 
          <span class="badge-role">Associate Workspace</span>
        </h1>
      </div>
      <p class="portal-subheading">Munendra Naick · Talent Forge Associate · Alpha Auron Private Limited</p>
    </div>
    <div class="topbar-actions" style="display: flex; gap: 10px; align-items: center;">
      <button id="empRefreshBtn" class="btn btn-outline btn-sm" onclick="refreshEmployeeLeads()">⟳ Refresh Leads</button>
      <a href="/api/admin/download-excel" class="btn btn-download-excel btn-sm">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Master Excel (.xlsx)
      </a>
      <button class="btn btn-outline btn-sm" onclick="handleLogout()" style="color: #f43f5e; border-color: rgba(244, 63, 94, 0.35); font-weight: 600;">
        Sign Out
      </button>
    </div>
  </header>

  <main class="admin-container">
    <section class="workspace-card">
      <div class="toolbar-deck">
        <h3 style="color: var(--text-pure); font-size: 1.15rem; font-weight: 700; margin: 0;">
          Assigned Prospective Members
        </h3>
      </div>

      <div class="table-frame">
        <table class="executive-table">
          <thead>
            <tr>
              <th>Lead Reference</th>
              <th>Candidate Contact</th>
              <th>Category & Skills</th>
              <th>Pipeline Status</th>
              <th>Follow-Up & Schedule</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="empLeadsBody">
            <tr>
              <td colspan="6" class="table-loader" style="text-align: center; padding: 30px;">
                Loading your assigned enquiries...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    async function refreshEmployeeLeads() {
      const btn = document.getElementById("empRefreshBtn");
      if (btn) {
        btn.disabled = true;
        btn.innerText = "⟳ Refreshing...";
      }
      try {
        await loadAssignedLeads();
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerText = "⟳ Refresh Leads";
        }
      }
    }
    async function loadAssignedLeads() {
      try {
        const res = await fetch("/api/admin/leads?employee_id=TF-EMP-MN01", {
          credentials: "include"
        });

        if (res.status === 401) {
          window.location.href = "/login";
          return;
        }

        const data = await res.json();
        const tbody = document.getElementById("empLeadsBody");

        if (!data.leads || data.leads.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 35px; color: var(--text-muted);">No leads currently assigned.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.leads.map(l => `
          <tr>
            <td>
              <span class="lead-id-badge">${l.lead_id}</span>
              <span class="lead-time">${l.submission_date}</span>
            </td>
            <td>
              <div class="candidate-name">${l.full_name}</div>
              <div class="candidate-contact">${l.email}<br>${l.mobile}</div>
            </td>
            <td>
              <div class="category-tag">${l.category}</div>
              <span class="skills-pill">${l.primary_skills}</span>
            </td>
            <td>
              <select id="status-${l.lead_id}" class="status-dropdown">
                ${["New Enquiry", "Contacted", "Interested", "Official Website Shared", "Follow-Up Required", "Enrolment in Progress", "Enrolled", "Verified", "Not Interested", "Closed"]
                  .map(s => `<option value="${s}" ${l.lead_status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
            <td>
              <input type="text" class="notes-input" id="notes-${l.lead_id}" value="${l.follow_up_notes || ''}" placeholder="Follow-up notes...">
              <input type="date" class="date-input" id="date-${l.lead_id}" value="${l.next_follow_up_date || ''}">
            </td>
            <td style="text-align: right;">
              <button class="btn btn-primary btn-sm" onclick="saveEmpNotes('${l.lead_id}')">Update</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error("Error loading employee leads:", err);
      }
    }

    async function saveEmpNotes(leadId) {
      const status = document.getElementById(`status-${leadId}`).value;
      const notes = document.getElementById(`notes-${leadId}`).value;
      const date = document.getElementById(`date-${leadId}`).value;

      try {
        const res = await fetch(`/api/admin/lead/${leadId}`, {
          method: "PATCH",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lead_status: status, follow_up_notes: notes, next_follow_up_date: date })
        });
        if (res.status === 401) { window.location.href = "/login"; return; }
        if (res.ok) {
          alert("Follow-up updated successfully.");
          await loadAssignedLeads();
        } else {
          alert("Failed to update follow-up.");
        }
      } catch (err) {
        console.error("Error updating lead notes:", err);
      }
    }

    async function handleLogout() {
      if (!confirm("Are you sure you want to end your active workspace session?")) return;
      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          credentials: "include"
        });
      } finally {
        window.location.href = "/login";
      }
    }

    document.addEventListener("DOMContentLoaded", loadAssignedLeads);
  </script>
</body>
</html>
